<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen 2 - Algoritmo de Dijkstra</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cálculo de Ruta Más Corta en Grafos</h1>
            <p>Implementación del Algoritmo de Dijkstra para la optimización de trayectos en redes de distribución logística.</p>
        </header>

        <div class="panel">
            <h2>Configuración y Selección de Ruta</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="select-preset">Grafo de Ejemplo:</label>
                    <select id="select-preset">
                        <option value="urbana">Red de Distribución Urbana (6 nodos)</option>
                        <option value="nacional">Red Troncal Nacional (7 nodos)</option>
                        <option value="academica">Grafo de Prueba (5 nodos)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="select-source">Nodo Origen:</label>
                    <select id="select-source"></select>
                </div>
                <div class="form-group">
                    <label for="select-target">Nodo Destino:</label>
                    <select id="select-target"></select>
                </div>
                <div>
                    <button id="btn-run" class="btn-primary">Calcular Ruta</button>
                    <button id="btn-reset">Restablecer</button>
                </div>
            </div>
        </div>

        <div class="graph-container">
            <svg id="graph-canvas" viewBox="0 0 900 380"></svg>
        </div>

        <div id="result-container" class="result-box info">
            Seleccione el nodo de origen y el nodo de destino, luego presione "Calcular Ruta".
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
